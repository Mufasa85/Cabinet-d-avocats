<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | ELMD - Cabinet d'Avocats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --login-bg: #0A0A0A;
            --login-card: #111111;
            --login-text: #FFFFFF;
            --login-muted: #7c7878;
            --login-border: #2A2A2A;
            --login-primary: #C9A227;
            --login-primary-hover: #B8860B;
            --login-primary-foreground: #0A0A0A;
        }

        [data-theme="light"] {
            --login-bg: #F5F5F5;
            --login-card: #FFFFFF;
            --login-text: #171717;
            --login-muted: #737373;
            --login-border: #E5E5E5;
            --login-primary: #C9A227;
            --login-primary-hover: #B8860B;
            --login-primary-foreground: #FFFFFF;
        }

        [data-theme="royal"] {
            --login-bg: #0F172A;
            --login-card: #1E293B;
            --login-text: #FFFFFF;
            --login-muted: #94A3B8;
            --login-border: #475569;
            --login-primary: #C9A227;
            --login-primary-hover: #D4AF37;
            --login-primary-foreground: #0F172A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--login-bg);
            color: var(--login-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 20px 0;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--login-text);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            color: var(--login-primary);
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        /* Main Section */
        .login-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 24px 80px;
            position: relative;
            overflow: hidden;
        }

        .login-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .login-gradient {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(201, 162, 39, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(201, 162, 39, 0.06) 0%, transparent 50%),
                linear-gradient(to bottom, transparent 0%, var(--login-bg) 100%);
        }

        .login-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: var(--login-card);
            border: 1px solid var(--login-border);
            border-radius: 16px;
            padding: 48px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            background: rgba(201, 162, 39, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .login-icon svg {
            width: 32px;
            height: 32px;
            color: var(--login-primary);
        }

        .login-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--login-text);
        }

        .login-header p {
            color: var(--login-muted);
            font-size: 0.9375rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--login-text);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--login-bg);
            border: 1px solid var(--login-border);
            border-radius: 8px;
            color: var(--login-text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: var(--login-muted);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--login-primary);
            box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--login-muted);
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--login-primary);
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input {
            display: none;
        }

        .checkbox-custom {
            width: 18px;
            height: 18px;
            border: 2px solid var(--login-border);
            border-radius: 4px;
            position: relative;
            transition: all 0.3s ease;
        }

        .remember-me input:checked + .checkbox-custom {
            background: var(--login-primary);
            border-color: var(--login-primary);
        }

        .checkbox-custom::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 5px;
            width: 5px;
            height: 10px;
            border: solid var(--login-bg);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) scale(0);
            transition: transform 0.3s ease;
        }

        .remember-me input:checked + .checkbox-custom::after {
            transform: rotate(45deg) scale(1);
        }

        .remember-me span {
            font-size: 0.875rem;
            color: var(--login-muted);
        }

        .forgot-password {
            font-size: 0.875rem;
            color: var(--login-primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 16px 32px;
            background: var(--login-primary);
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--login-primary-foreground);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(201, 162, 39, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201, 162, 39, 0.4);
        }

        .btn-login svg {
            width: 18px;
            height: 18px;
            margin-left: 8px;
            transition: transform 0.3s ease;
        }

        .btn-login:hover svg {
            transform: translateX(4px);
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
        }

        .register-link p {
            font-size: 0.9375rem;
            color: var(--login-muted);
        }

        .register-link a {
            color: var(--login-primary);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            padding: 24px;
            border-top: 1px solid var(--login-border);
        }

        .login-footer p {
            font-size: 0.8125rem;
            color: var(--login-muted);
        }

        .login-footer a {
            color: var(--login-primary);
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 3v18M3 12h18M5.5 5.5l13 13M5.5 18.5l13-13"/>
                    <circle cx="12" cy="3" r="1" fill="currentColor"/>
                    <path d="M7 21h10M9 21v-3h6v3"/>
                </svg>
                <span class="logo-text">ELMD</span>
            </a>
            <div id="theme-switcher-container" class="theme-switcher-wrapper"></div>
        </div>
    </header>

    <!-- Login Section -->
    <section class="login-section">
        <div class="login-bg">
            <div class="login-gradient"></div>
            <div class="login-pattern"></div>
        </div>

        <div class="login-container">
            <div class="login-card animate-on-scroll">
                <div class="login-header">
                    <div class="login-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <h1>Bienvenue</h1>
                    <p>Connectez-vous à votre espace</p>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="email">Adresse email</label>
                        <input type="email" id="email" name="email" required placeholder="votre@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" required placeholder="••••••••">
                            <button type="button" class="password-toggle" id="togglePassword" title="Afficher/Masquer le mot de passe">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span class="checkbox-custom"></span>
                            <span>Se souvenir de moi</span>
                        </label>
                        <a href="#" class="forgot-password">Mot de passe oublié ?</a>
                    </div>

                    <button type="submit" class="btn-login">
                        <span>Se connecter</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </form>

                <div class="register-link">
                    <p><a href="index.html">Retour à l'accueil</a></p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="login-footer">
        <p>&copy; 2024 ELMD & Associés. <a href="#">Politique de confidentialité</a></p>
    </footer>

    <script type="module" src="theme.js"></script>
    <script>
        // Password toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            
            const eyeIcon = togglePassword.querySelector('svg');
            if (type === 'text') {
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        });

        // Form submission
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Simulate login
            console.log('Login:', email, password);
            alert('Connexion réussie !');
        });

        // Animation on scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animated');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));
    </script>
</body>
</html>
